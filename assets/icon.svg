<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#4A42DB"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="none" stroke="#000" stroke-width="8"/>
  <!-- Compass circle -->
  <circle cx="256" cy="256" r="140" fill="#FBFBF9" stroke="#000" stroke-width="6"/>
  <circle cx="256" cy="256" r="20" fill="#2D2D2D"/>
  <!-- Compass needle -->
  <polygon points="256,110 240,256 256,270 272,256" fill="#FF6B6B" stroke="#000" stroke-width="3"/>
  <polygon points="256,402 240,256 256,242 272,256" fill="#2D2D2D" stroke="#000" stroke-width="3"/>
  <!-- Compass points -->
  <text x="256" y="170" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="28" fill="#2D2D2D">N</text>
  <text x="256" y="380" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="28" fill="#2D2D2D">S</text>
  <text x="170" y="264" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="24" fill="#2D2D2D">W</text>
  <text x="342" y="264" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="24" fill="#2D2D2D">E</text>
  <!-- Ring markings -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-dasharray="8 6"/>
</svg>
