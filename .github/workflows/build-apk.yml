name: Build Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm install

      - name: Build web app
        run: npm run build

      - name: Check version sync
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -e "const fs=require('fs'); const m=fs.readFileSync('src/lib/updateChecker.ts','utf8').match(/: '([^']+)'\$/); console.log(m?.[1] || '')")
          ANDROID_VERSION=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | sed 's/versionName "//;s/"//')
          test "$PKG_VERSION" = "$APP_VERSION"
          test "$PKG_VERSION" = "$ANDROID_VERSION"

      - name: Package web build for OTA
        run: |
          cd dist
          zip -r ../web-build.zip .
          cd ..

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Android signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f app/release-key.jks ]; then
            ./gradlew assembleRelease
          else
            echo "Signing secrets missing; building debug APK fallback. Use GitHub secrets for installable public updates."
            ./gradlew assembleDebug
          fi

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk cma-compass-v${{ steps.version.outputs.VERSION }}.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk cma-compass-v${{ steps.version.outputs.VERSION }}.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cma-compass-v${{ steps.version.outputs.VERSION }}
          path: cma-compass-v${{ steps.version.outputs.VERSION }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: CMA Compass v${{ steps.version.outputs.VERSION }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            cma-compass-v${{ steps.version.outputs.VERSION }}.apk
            web-build.zip
          generate_release_notes: true
